services:
  relay:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    depends_on:
      relay:
        condition: service_healthy
    environment:
      CREW_DOMAIN: ${CREW_DOMAIN:?set CREW_DOMAIN}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - crew-caddy-data:/data
      - crew-caddy-config:/config
    restart: unless-stopped
    networks:
      - crew-net

volumes:
  crew-caddy-data:
    labels:
      com.crew.volume: caddy-data
  crew-caddy-config:
    labels:
      com.crew.volume: caddy-config
