name: crew-prod

services:
  relay:
    image: ${CREW_IMAGE:-ghcr.io/patty-io/crew:main}
    env_file:
      - .env
    environment:
      CREW_BIND_ADDR: 0.0.0.0:3000
      CREW_HEALTH_PORT: "8080"
      CREW_METRICS_PORT: "9102"
      DATABASE_URL: postgres://${POSTGRES_USER:-crew}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crew}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      CREW_S3_ENDPOINT: http://minio:9000
      # Docker DNS resolves `minio`, not arbitrary `<bucket>.minio` hosts.
      CREW_S3_ADDRESSING_STYLE: path
      CREW_S3_ACCESS_KEY: ${CREW_S3_ACCESS_KEY:?set CREW_S3_ACCESS_KEY}
      CREW_S3_SECRET_KEY: ${CREW_S3_SECRET_KEY:?set CREW_S3_SECRET_KEY}
      CREW_S3_BUCKET: ${CREW_S3_BUCKET:-crew-media}
      CREW_GIT_REPO_PATH: /data/git
      CREW_AUTO_MIGRATE: ${CREW_AUTO_MIGRATE:-false}
      CREW_GIT_CONFORMANCE_PROBE: ${CREW_GIT_CONFORMANCE_PROBE:-true}
    ports:
      - "${CREW_HTTP_PORT:-3000}:3000"
    volumes:
      - crew-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Probe /_readiness over /dev/tcp because the runtime image has bash but no curl/wget/socat.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - crew-net

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crew}
      POSTGRES_USER: ${POSTGRES_USER:-crew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - crew-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - crew-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - crew-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - crew-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CREW_S3_ACCESS_KEY:?set CREW_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${CREW_S3_SECRET_KEY:?set CREW_S3_SECRET_KEY}
    volumes:
      - crew-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - crew-net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CREW_S3_ACCESS_KEY: ${CREW_S3_ACCESS_KEY:?set CREW_S3_ACCESS_KEY}
      CREW_S3_SECRET_KEY: ${CREW_S3_SECRET_KEY:?set CREW_S3_SECRET_KEY}
      CREW_S3_BUCKET: ${CREW_S3_BUCKET:-crew-media}
    entrypoint: >
      /bin/sh -euc '
        mc alias set local http://minio:9000 "$${CREW_S3_ACCESS_KEY}" "$${CREW_S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${CREW_S3_BUCKET}"
        mc anonymous set none "local/$${CREW_S3_BUCKET}"
      '
    restart: "no"
    networks:
      - crew-net

volumes:
  crew-postgres-data:
    labels:
      com.crew.volume: postgres
  crew-redis-data:
    labels:
      com.crew.volume: redis
  crew-minio-data:
    labels:
      com.crew.volume: minio
  crew-git-data:
    labels:
      com.crew.volume: git

networks:
  crew-net:
    driver: bridge
    labels:
      com.crew.network: production
